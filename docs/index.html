    axes: { x: [-2.6, 4.8], y: [-2.6, 2.9] },
    dash: [['x0', 'V']],
    nolab: ['V'],
    lab: { x1: 'sw', x2: 'se', x0: 'n' },
    w: 300, alt: 'График y = x² − 2x − 3: парабола с ветвями вверх, корни x₁ = −1 и x₂ = 3, вершина при x₀ = 1, пунктир — ось симметрии'
  });

  MM.addTopic({
    id: 'alg-quad',
    sec: 'alg',
    title: 'Квадратные уравнения и теорема Виета',
    blurb: `Формула корней, теорема Виета, парабола и уравнения, которые сводятся к квадратным. На олимпиаде квадратный трёхчлен прячется почти в каждой алгебраической задаче.`,

    lessons: [
      { id: 'quad-l1', title: 'Квадратное уравнение и полный квадрат', mins: 12, html: `
<p><b>Квадратное уравнение</b> — это уравнение вида <span class="m">ax<sup>2</sup> + bx + c = 0</span>, где <span class="m">a ≠ 0</span>. Число <span class="m">a</span> называют старшим коэффициентом, <span class="m">b</span> — вторым коэффициентом, <span class="m">c</span> — свободным членом. Если <span class="m">a = 0</span>, уравнение уже линейное, и решать его нужно по-другому. В задачах с буквами об этом часто забывают.</p>
<h3>Неполные уравнения</h3>
<div class="box"><div class="box-h">Три случая</div><ul>
<li><b>c = 0.</b> <span class="m">5x<sup>2</sup> + 2x = 0</span>, то есть <span class="m">x(5x + 2) = 0</span>: <span class="m">x = 0</span> или <span class="m">x = −${fr('2', '5')}</span>.</li>
<li><b>b = 0.</b> <span class="m">9x<sup>2</sup> − 4 = 0</span>, то есть <span class="m">x<sup>2</sup> = ${fr('4', '9')}</span>: <span class="m">x = ±${fr('2', '3')}</span>. А у уравнения <span class="m">x<sup>2</sup> + 16 = 0</span> корней нет: квадрат не бывает отрицательным.</li>
<li><b>b = c = 0.</b> Уравнение <span class="m">ax<sup>2</sup> = 0</span> имеет единственный корень <span class="m">x = 0</span>.</li>
</ul></div>
<h3>Выделение полного квадрата</h3>
<p>Любое квадратное уравнение сводится к виду «квадрат = число». Решим <span class="m">x<sup>2</sup> + 6x − 7 = 0</span>. Так как <span class="m">x<sup>2</sup> + 6x = (x + 3)<sup>2</sup> − 9</span>, уравнение превращается в <span class="m">(x + 3)<sup>2</sup> = 16</span>. Отсюда <span class="m">x + 3 = 4</span> или <span class="m">x + 3 = −4</span>, то есть <span class="m">x = 1</span> или <span class="m">x = −7</span>.</p>
<p>Правило: к <span class="m">x<sup>2</sup> + 2kx</span> добавляем <span class="m">k<sup>2</sup></span> и получаем <span class="m">(x + k)<sup>2</sup></span>. Половину коэффициента при <span class="m">x</span> возводим в квадрат.</p>
<h3>Две частые ошибки</h3>
<ul>
<li>Из <span class="m">x<sup>2</sup> = 9</span> следует <span class="m">x = 3</span> <b>или</b> <span class="m">x = −3</span>. Отрицательный корень теряют очень часто.</li>
<li>В уравнении <span class="m">x<sup>2</sup> = 5x</span> нельзя делить на <span class="m">x</span>: пропадёт корень <span class="m">x = 0</span>. Правильно так: <span class="m">x(x − 5) = 0</span>, корни 0 и 5.</li>
</ul>
<div class="trick"><div class="trick-h">Олимпиадный приём</div>
<p>Не дели обе части уравнения на выражение с неизвестным: оно может оказаться нулём. Переноси всё в одну сторону и раскладывай на множители. Произведение равно нулю, когда хотя бы один множитель равен нулю.</p></div>` },

      { id: 'quad-l2', title: 'Дискриминант и формула корней', mins: 14, html: `
<p>Выделим полный квадрат в общем виде. Умножим уравнение <span class="m">ax<sup>2</sup> + bx + c = 0</span> на <span class="m">4a</span> и прибавим к обеим частям <span class="m">b<sup>2</sup></span>:</p>
<p class="calc"><span class="m">4a<sup>2</sup>x<sup>2</sup> + 4abx + b<sup>2</sup> = b<sup>2</sup> − 4ac</span>, то есть <span class="m">(2ax + b)<sup>2</sup> = b<sup>2</sup> − 4ac</span>.</p>
<p>Число <span class="m">D = b<sup>2</sup> − 4ac</span> называют <b>дискриминантом</b> (по-латыни «различающий»): по нему видно, сколько у уравнения корней.</p>
<div class="box"><div class="box-h">Запомни</div><ul>
<li><span class="m">D > 0</span>: два корня <span class="m">x = ${fr('−b ± ' + sq('D'), '2a')}</span>.</li>
<li><span class="m">D = 0</span>: один корень <span class="m">x = −${fr('b', '2a')}</span>.</li>
<li><span class="m">D < 0</span>: действительных корней нет, потому что квадрат <span class="m">(2ax + b)<sup>2</sup></span> не бывает отрицательным.</li>
</ul></div>
<div class="ex"><div class="ex-h">Пример</div>
<p>Решите уравнение <span class="m">2x<sup>2</sup> − 3x − 2 = 0</span>.</p>
<p><b>Решение.</b> <span class="m">D = 9 + 16 = 25</span>, <span class="m">x = ${fr('3 ± 5', '4')}</span>, то есть <span class="m">x = 2</span> или <span class="m">x = −${fr('1', '2')}</span>.</p></div>
<h3>Чётный второй коэффициент</h3>
<p>Если <span class="m">b = 2k</span>, удобнее формула <span class="m">x = ${fr('−k ± ' + sq('k<sup>2</sup> − ac'), 'a')}</span>, где под корнем стоит <span class="m">${fr('D', '4')} = k<sup>2</sup> − ac</span>. Для <span class="m">3x<sup>2</sup> − 8x + 5 = 0</span>: <span class="m">k = −4</span>, <span class="m">${fr('D', '4')} = 16 − 15 = 1</span>, <span class="m">x = ${fr('4 ± 1', '3')}</span>, корни <span class="m">${fr('5', '3')}</span> и 1.</p>
<h3>Корни без формулы</h3>
<p>Если <span class="m">a + b + c = 0</span>, то <span class="m">x = 1</span> — корень, а второй корень равен <span class="m">${fr('c', 'a')}</span>. У уравнения <span class="m">7x<sup>2</sup> − 9x + 2 = 0</span> сумма коэффициентов равна нулю, поэтому его корни 1 и <span class="m">${fr('2', '7')}</span>.</p>
<p>Если <span class="m">a − b + c = 0</span>, то корень <span class="m">x = −1</span>, а второй равен <span class="m">−${fr('c', 'a')}</span>. У <span class="m">5x<sup>2</sup> + 7x + 2 = 0</span> корни −1 и <span class="m">−${fr('2', '5')}</span>.</p>
<div class="trick"><div class="trick-h">Олимпиадный приём</div>
<p>Если <span class="m">a</span> и <span class="m">c</span> разных знаков, то <span class="m">−4ac > 0</span> и <span class="m">D = b<sup>2</sup> − 4ac > 0</span>: корни есть при любом <span class="m">b</span>. В задачах с параметром это экономит половину работы.</p></div>` },

      { id: 'quad-l3', title: 'Теорема Виета', mins: 14, html: `
<div class="box"><div class="box-h">Теорема Виета</div>
<p>Если ${X1} и ${X2} — корни уравнения <span class="m">ax<sup>2</sup> + bx + c = 0</span>, то</p>
<p class="calc"><span class="m">${X1} + ${X2} = −${fr('b', 'a')}</span>, <span class="m">${X1}${X2} = ${fr('c', 'a')}</span>.</p>
<p>Для приведённого уравнения <span class="m">x<sup>2</sup> + px + q = 0</span> (старший коэффициент равен 1) сумма корней равна <span class="m">−p</span>, а произведение равно <span class="m">q</span>.</p></div>
<p><b>Доказательство.</b> Сложим и перемножим корни из формулы:</p>
<p class="calc"><span class="m">${fr('−b + ' + sq('D'), '2a')} + ${fr('−b − ' + sq('D'), '2a')} = −${fr('b', 'a')}</span>,<br>
<span class="m">${fr('−b + ' + sq('D'), '2a')} · ${fr('−b − ' + sq('D'), '2a')} = ${fr('b<sup>2</sup> − D', '4a<sup>2</sup>')} = ${fr('4ac', '4a<sup>2</sup>')} = ${fr('c', 'a')}</span>.</p>
<p>При <span class="m">D = 0</span> единственный корень считают дважды: <span class="m">${X1} = ${X2}</span>.</p>
<p><b>Обратная теорема.</b> Если <span class="m">u + v = −p</span> и <span class="m">uv = q</span>, то <span class="m">u</span> и <span class="m">v</span> — корни уравнения <span class="m">x<sup>2</sup> + px + q = 0</span>. Это видно из равенства <span class="m">(x − u)(x − v) = x<sup>2</sup> − (u + v)x + uv</span>.</p>
<h3>Что даёт теорема</h3>
<ol>
<li><b>Корни подбором.</b> <span class="m">x<sup>2</sup> − 9x + 20 = 0</span>: два числа с суммой 9 и произведением 20 — это 4 и 5. <span class="m">x<sup>2</sup> + 2x − 24 = 0</span>: сумма −2, произведение −24 — это 4 и −6.</li>
<li><b>Выражения от корней без решения.</b> Для <span class="m">x<sup>2</sup> − 4x + 1 = 0</span>: <span class="m">${X1} + ${X2} = 4</span>, <span class="m">${X1}${X2} = 1</span>. Поэтому <span class="m">${X1}<sup>2</sup> + ${X2}<sup>2</sup> = 16 − 2 = 14</span> и <span class="m">(${X1} − ${X2})<sup>2</sup> = 16 − 4 = 12</span>. Таблица таких формул — в теме «Выражения и тождества».</li>
<li><b>Уравнение по корням.</b> У чисел <span class="m">2 + ${sq('3')}</span> и <span class="m">2 − ${sq('3')}</span> сумма 4, а произведение <span class="m">4 − 3 = 1</span>. Значит, это корни уравнения <span class="m">x<sup>2</sup> − 4x + 1 = 0</span> — того самого, что выше.</li>
<li><b>Знаки корней.</b> Если <span class="m">q < 0</span>, корни есть всегда (<span class="m">D = p<sup>2</sup> − 4q > 0</span>), и они разных знаков. Если <span class="m">q > 0</span> и корни есть, то знаки одинаковые: оба корня положительны при <span class="m">p < 0</span> и оба отрицательны при <span class="m">p > 0</span>.</li>
</ol>
<div class="box"><div class="box-h">Осторожно</div>
<p>Теорема Виета говорит о корнях, которые <b>существуют</b>. У <span class="m">x<sup>2</sup> + x + 1 = 0</span> корней нет (<span class="m">D = −3</span>), и фраза «сумма корней равна −1» бессмысленна. Прежде чем пользоваться теоремой, проверь, что <span class="m">D ≥ 0</span>.</p></div>
<div class="trick"><div class="trick-h">Олимпиадный приём</div>
<p>Любое симметрическое выражение от корней записывается через их сумму и произведение. Решать само уравнение почти никогда не нужно, а иррациональные корни только мешают.</p></div>` },

      { id: 'quad-l4', title: 'Уравнения, сводящиеся к квадратным', mins: 14, html: `
<h3>Разложение трёхчлена на множители</h3>
<p>Если ${X1} и ${X2} — корни трёхчлена <span class="m">ax<sup>2</sup> + bx + c</span>, то</p>
<p class="calc"><span class="m">ax<sup>2</sup> + bx + c = a(x − ${X1})(x − ${X2})</span>.</p>
<p>Это следует из теоремы Виета: <span class="m">a(x − ${X1})(x − ${X2}) = a(x<sup>2</sup> + ${fr('b', 'a')}x + ${fr('c', 'a')})</span>. Например, <span class="m">2x<sup>2</sup> − 3x − 2 = 2(x − 2)(x + ${fr('1', '2')}) = (x − 2)(2x + 1)</span>. Так сокращают дроби: <span class="m">${fr('x<sup>2</sup> − 4', '2x<sup>2</sup> − 3x − 2')} = ${fr('x + 2', '2x + 1')}</span> при <span class="m">x ≠ 2</span>.</p>
<h3>Замена переменной</h3>
<ul>
<li><b>Биквадратное уравнение</b> <span class="m">x<sup>4</sup> − 10x<sup>2</sup> + 9 = 0</span>. Замена <span class="m">t = x<sup>2</sup></span> даёт <span class="m">t<sup>2</sup> − 10t + 9 = 0</span>, <span class="m">t = 1</span> или <span class="m">t = 9</span>, откуда <span class="m">x = ±1</span>, <span class="m">x = ±3</span>. Помни, что <span class="m">t = x<sup>2</sup> ≥ 0</span>: отрицательные значения <span class="m">t</span> корней не дают.</li>
<li><b>Повторяющийся блок.</b> В уравнении <span class="m">x(x + 1)(x + 2)(x + 3) = 24</span> перемножим крайние и средние скобки: <span class="m">(x<sup>2</sup> + 3x)(x<sup>2</sup> + 3x + 2) = 24</span>. При <span class="m">t = x<sup>2</sup> + 3x</span> получаем <span class="m">t<sup>2</sup> + 2t − 24 = 0</span>, <span class="m">t = 4</span> или <span class="m">t = −6</span>. Уравнение <span class="m">x<sup>2</sup> + 3x − 4 = 0</span> даёт корни 1 и −4, а у <span class="m">x<sup>2</sup> + 3x + 6 = 0</span> корней нет.</li>
</ul>
<div class="ex"><div class="ex-h">Пример: возвратное уравнение</div>
<p>Решите уравнение <span class="m">2x<sup>4</sup> − 5x<sup>3</sup> + 4x<sup>2</sup> − 5x + 2 = 0</span>.</p>
<p><b>Решение.</b> Коэффициенты читаются одинаково слева направо и справа налево. Число 0 не корень, поэтому разделим на <span class="m">x<sup>2</sup></span>:</p>
<p class="calc"><span class="m">2(x<sup>2</sup> + ${fr('1', 'x<sup>2</sup>')}) − 5(x + ${fr('1', 'x')}) + 4 = 0</span>.</p>
<p>Пусть <span class="m">t = x + ${fr('1', 'x')}</span>, тогда <span class="m">x<sup>2</sup> + ${fr('1', 'x<sup>2</sup>')} = t<sup>2</sup> − 2</span> и <span class="m">2t<sup>2</sup> − 5t = 0</span>: <span class="m">t = 0</span> или <span class="m">t = ${fr('5', '2')}</span>. Значение <span class="m">t = 0</span> невозможно, потому что <span class="m">|x + ${fr('1', 'x')}| ≥ 2</span>. Из <span class="m">x + ${fr('1', 'x')} = ${fr('5', '2')}</span> получаем <span class="m">2x<sup>2</sup> − 5x + 2 = 0</span>, корни 2 и <span class="m">${fr('1', '2')}</span>.</p></div>
<h3>Дробные уравнения</h3>
<p>Умножаем на общий знаменатель, решаем и <b>выбрасываем</b> корни, при которых знаменатель равен нулю. Уравнение <span class="m">${fr('x<sup>2</sup>', 'x − 3')} = ${fr('9', 'x − 3')}</span> сводится к <span class="m">x<sup>2</sup> = 9</span>, но <span class="m">x = 3</span> запрещён, поэтому ответ только <span class="m">x = −3</span>.</p>
<div class="trick"><div class="trick-h">Олимпиадный приём</div>
<p>Ищи повторяющийся блок. Если его не видно, создай его: сгруппируй скобки попарно так, чтобы суммы чисел в парах совпали (<span class="m">0 + 3 = 1 + 2</span>). В возвратных уравнениях блок — это <span class="m">x + ${fr('1', 'x')}</span>.</p></div>` },

      { id: 'quad-l5', title: 'Парабола и квадратные неравенства', mins: 14, html: `
<p>Выделим полный квадрат в общем виде:</p>
<p class="calc"><span class="m">ax<sup>2</sup> + bx + c = a(x − x<sub>0</sub>)<sup>2</sup> + y<sub>0</sub></span>, где <span class="m">x<sub>0</sub> = −${fr('b', '2a')}</span>, <span class="m">y<sub>0</sub> = −${fr('D', '4a')}</span>.</p>
<p>Поэтому график <span class="m">y = ax<sup>2</sup> + bx + c</span> — это парабола <span class="m">y = ax<sup>2</sup></span>, сдвинутая так, что её вершина попала в точку <span class="m">(x<sub>0</sub>; y<sub>0</sub>)</span>. При <span class="m">a > 0</span> ветви направлены вверх, и в вершине наименьшее значение. При <span class="m">a < 0</span> ветви направлены вниз, и в вершине наибольшее значение.</p>
<p>Прямая <span class="m">x = x<sub>0</sub></span> — ось симметрии параболы. Поэтому <span class="m">x<sub>0</sub></span> лежит ровно посередине между корнями: <span class="m">x<sub>0</sub> = ${fr(X1 + ' + ' + X2, '2')}</span>.</p>
${figPar}
<div class="ex"><div class="ex-h">Пример</div>
<p>Найдите наибольшее значение выражения <span class="m">−2x<sup>2</sup> + 8x − 3</span>.</p>
<p><b>Решение.</b> <span class="m">a = −2 < 0</span>, наибольшее значение — в вершине: <span class="m">x<sub>0</sub> = −${fr('8', '2 · (−2)')} = 2</span>. Значение: <span class="m">−8 + 16 − 3 = 5</span>.</p></div>
<h3>Знак трёхчлена и неравенства</h3>
<p>На чертеже график <span class="m">y = x<sup>2</sup> − 2x − 3 = (x + 1)(x − 3)</span>: трёхчлен отрицателен между корнями и положителен снаружи. Поэтому <span class="m">x<sup>2</sup> − 2x − 3 < 0</span> при <span class="m">−1 < x < 3</span>, а <span class="m">x<sup>2</sup> − 2x − 3 ≥ 0</span> при <span class="m">x ≤ −1</span> или <span class="m">x ≥ 3</span>.</p>
<div class="box"><div class="box-h">Правило знаков</div><ul>
<li>Два корня: между корнями знак трёхчлена противоположен знаку <span class="m">a</span>, снаружи совпадает с ним.</li>
<li><span class="m">D = 0</span>: знак <span class="m">a</span> везде, кроме самого корня.</li>
<li><span class="m">D < 0</span>: знак <span class="m">a</span> при всех <span class="m">x</span>. Например, <span class="m">x<sup>2</sup> + x + 1 > 0</span> при любом <span class="m">x</span>.</li>
</ul></div>
<div class="trick"><div class="trick-h">Олимпиадный приём</div>
<p>Задачи «найди наибольшее или наименьшее» часто сводятся к параболе. Вырази величину через одну переменную — получится квадратный трёхчлен, а его наибольшее или наименьшее значение — в вершине. Только проверь, что вершина попадает в допустимую область.</p></div>` },

      { id: 'quad-l6', title: 'Олимпиадные приёмы', mins: 16, html: `
<h3>1. Целые корни</h3>
<p>Если корни целые, теорема Виета превращает условие в уравнение в целых числах, которое часто раскладывается на множители.</p>
<div class="ex"><div class="ex-h">Пример</div>
<p>При каких <span class="m">a</span> оба корня уравнения <span class="m">x<sup>2</sup> + ax + a = 0</span> целые?</p>
<p><b>Решение.</b> <span class="m">${X1} + ${X2} = −a</span>, <span class="m">${X1}${X2} = a</span>. Сложим: <span class="m">${X1}${X2} + ${X1} + ${X2} = 0</span>, то есть <span class="m">(${X1} + 1)(${X2} + 1) = 1</span>. Оба множителя равны 1 или оба равны −1. Корни 0 и 0 (тогда <span class="m">a = 0</span>) или −2 и −2 (тогда <span class="m">a = 4</span>).</p></div>
<p>Полезный факт: если <span class="m">a</span>, <span class="m">b</span>, <span class="m">c</span> — целые числа, то корни уравнения рациональны тогда и только тогда, когда <span class="m">D</span> — точный квадрат.</p>
<h3>2. Общий корень</h3>
<p>Общий корень двух уравнений — это и корень их разности, а в разности квадраты часто сокращаются.</p>
<div class="ex"><div class="ex-h">Пример</div>
<p>При каких <span class="m">a</span> уравнения <span class="m">x<sup>2</sup> + ax − 6 = 0</span> и <span class="m">x<sup>2</sup> − 6x + a = 0</span> имеют общий корень?</p>
<p><b>Решение.</b> Пусть <span class="m">x<sub>0</sub></span> — общий корень. Вычтем: <span class="m">(a + 6)x<sub>0</sub> − 6 − a = 0</span>, то есть <span class="m">(a + 6)(x<sub>0</sub> − 1) = 0</span>. Если <span class="m">a = −6</span>, уравнения совпадают, а у <span class="m">x<sup>2</sup> − 6x − 6 = 0</span> корни есть — подходит. Если <span class="m">x<sub>0</sub> = 1</span>, то <span class="m">1 + a − 6 = 0</span>, <span class="m">a = 5</span>: уравнения <span class="m">x<sup>2</sup> + 5x − 6 = 0</span> и <span class="m">x<sup>2</sup> − 6x + 5 = 0</span> оба имеют корень 1. Ответ: <span class="m">a = 5</span> или <span class="m">a = −6</span>.</p></div>
<h3>3. Числа существуют — значит, D ≥ 0</h3>
<p>Любые два действительных числа <span class="m">x</span> и <span class="m">y</span> — корни уравнения <span class="m">t<sup>2</sup> − (x + y)t + xy = 0</span>, поэтому его дискриминант неотрицателен: <span class="m">(x + y)<sup>2</sup> ≥ 4xy</span>. Это ограничивает сумму и произведение.</p>
<div class="ex"><div class="ex-h">Пример</div>
<p>Действительные числа <span class="m">x</span> и <span class="m">y</span> таковы, что <span class="m">x<sup>2</sup> + xy + y<sup>2</sup> = 3</span>. Найдите наибольшее значение <span class="m">x + y</span>.</p>
<p><b>Решение.</b> Пусть <span class="m">s = x + y</span>, <span class="m">p = xy</span>. Тогда <span class="m">s<sup>2</sup> − p = 3</span>, то есть <span class="m">p = s<sup>2</sup> − 3</span>. Условие <span class="m">s<sup>2</sup> ≥ 4p</span> даёт <span class="m">s<sup>2</sup> ≥ 4s<sup>2</sup> − 12</span>, <span class="m">s<sup>2</sup> ≤ 4</span>. Наибольшее значение <span class="m">s = 2</span> достигается при <span class="m">x = y = 1</span>.</p></div>
<h3>4. Квадратное уравнение относительно одной буквы</h3>
<p>Уравнение с двумя неизвестными можно считать квадратным относительно <span class="m">x</span>, а <span class="m">y</span> — просто числом. Тогда условие <span class="m">D ≥ 0</span> ограничивает <span class="m">y</span>, и в целых числах остаётся перебрать несколько значений.</p>
<div class="trick"><div class="trick-h">Олимпиадный приём</div>
<p>В условии «корни целые» — пиши теорему Виета и раскладывай на множители (часто помогает прибавить 1 к обеим частям). Два уравнения с общим корнем — вычитай. Нужно оценить переменную — найди квадратное уравнение, корни которого заведомо существуют, и потребуй <span class="m">D ≥ 0</span>.</p></div>` }

      { id: 'quad-29', lvl: 4, r: 1680, type: 'num', q: `Корни уравнения x<sup>2</sup> + px + q = 0 — целые числа, и p + q = 2026. Какой наибольший корень может быть у такого уравнения?`, a: ['2028'],
        hints: [`По теореме Виета p = −(${X1} + ${X2}), q = ${X1}${X2}. Запиши p + q через корни.`, `${X1}${X2} − ${X1} − ${X2} = 2026. Прибавь 1 к обеим частям и разложи на множители.`, `(${X1} − 1)(${X2} − 1) = 2027, а 2027 — простое число.`],
        sol: `p + q = ${X1}${X2} − ${X1} − ${X2} = 2026, откуда (${X1} − 1)(${X2} − 1) = 2027. Число 2027 простое: оно не делится ни на одно простое число до 43 включительно, а 47<sup>2</sup> > 2027. Поэтому множители равны 1 и 2027 или −1 и −2027, то есть корни 2 и 2028 либо 0 и −2026. Наибольший возможный корень — 2028.` },
      { id: 'quad-30', lvl: 4, r: 1720, type: 'proof', q: `Докажите, что если a, b и c — нечётные целые числа, то уравнение ax<sup>2</sup> + bx + c = 0 не имеет рациональных корней.`,
        hints: [`Пусть x = m/n — несократимая дробь. Подставь её и умножь на n<sup>2</sup>.`, `am<sup>2</sup> + bmn + cn<sup>2</sup> = 0. Числа m и n не могут быть оба чётными.`, `Разбери случаи: оба нечётные; одно чётное, другое нечётное.`],
        sol: `Пусть x = ${fr('m', 'n')} — корень, и дробь несократима, то есть m и n не оба чётные. Умножив на n<sup>2</sup>, получаем am<sup>2</sup> + bmn + cn<sup>2</sup> = 0. Если m и n оба нечётные, все три слагаемых нечётны, и их сумма нечётна, то есть не равна нулю. Если ровно одно из чисел m, n чётно, то слагаемое bmn и одно из слагаемых am<sup>2</sup>, cn<sup>2</sup> чётны, а оставшееся нечётно — сумма снова нечётна. Противоречие.<br>Другой способ: D = b<sup>2</sup> − 4ac даёт остаток 5 при делении на 8 (b<sup>2</sup> даёт остаток 1, а 4ac — остаток 4), а квадрат нечётного числа даёт остаток 1. Значит, D не точный квадрат, и корни иррациональны или их нет.`,
        rubric: [[2, `Корень записан несократимой дробью m/n, получено am<sup>2</sup> + bmn + cn<sup>2</sup> = 0`], [4, `Разобраны все случаи чётности m и n (или доказано, что D не точный квадрат)`], [1, `Вывод`]] },
      { id: 'quad-31', lvl: 4, r: 1760, type: 'num', q: `Действительные числа x, y, z таковы, что x + y + z = 5 и xy + yz + zx = 8. Найдите наибольшее возможное значение z. Ответ запишите обыкновенной дробью.`, a: ['7/3'],
        hints: [`Вырази x + y и xy через z.`, `x + y = 5 − z, xy = 8 − z(5 − z). Числа x и y — корни квадратного уравнения, значит, его дискриминант неотрицателен.`],
        sol: `x + y = 5 − z, xy = 8 − z(x + y) = z<sup>2</sup> − 5z + 8. Числа x и y — корни уравнения t<sup>2</sup> − (5 − z)t + z<sup>2</sup> − 5z + 8 = 0, поэтому (5 − z)<sup>2</sup> − 4(z<sup>2</sup> − 5z + 8) ≥ 0, то есть 3z<sup>2</sup> − 10z + 7 ≤ 0, (z − 1)(3z − 7) ≤ 0, 1 ≤ z ≤ ${fr('7', '3')}. При z = ${fr('7', '3')} подходят x = y = ${fr('4', '3')}: сумма 5, а xy + z(x + y) = ${fr('16', '9')} + ${fr('56', '9')} = 8. Ответ: 7/3.` },
      { id: 'quad-32', lvl: 4, r: 1800, type: 'proof', q: `Докажите, что при любых a, b, c хотя бы одно из уравнений x<sup>2</sup> + 2ax + bc = 0, x<sup>2</sup> + 2bx + ca = 0, x<sup>2</sup> + 2cx + ab = 0 имеет действительный корень.`,
        hints: [`Сложи три дискриминанта, делённые на 4.`, `a<sup>2</sup> − bc + b<sup>2</sup> − ca + c<sup>2</sup> − ab = ½((a − b)<sup>2</sup> + (b − c)<sup>2</sup> + (c − a)<sup>2</sup>).`],
        sol: `${fr('D<sub>1</sub>', '4')} + ${fr('D<sub>2</sub>', '4')} + ${fr('D<sub>3</sub>', '4')} = (a<sup>2</sup> − bc) + (b<sup>2</sup> − ca) + (c<sup>2</sup> − ab) = ${fr('1', '2')}((a − b)<sup>2</sup> + (b − c)<sup>2</sup> + (c − a)<sup>2</sup>) ≥ 0. Если бы все три дискриминанта были отрицательны, их сумма была бы отрицательной. Значит, хотя бы один из них неотрицателен, и у этого уравнения есть корень.`,
        rubric: [[2, `Выписаны дискриминанты трёх уравнений`], [3, `Их сумма представлена как сумма квадратов и потому неотрицательна`], [2, `Вывод: один из дискриминантов неотрицателен`]] },
      { id: 'quad-33', lvl: 4, r: 1840, type: 'num', q: `Сколько решений в целых числах имеет уравнение x<sup>2</sup> − xy + y<sup>2</sup> = x + y?`, a: ['6'],
        hints: [`Считай уравнение квадратным относительно x.`, `x<sup>2</sup> − (y + 1)x + y<sup>2</sup> − y = 0. Дискриминант должен быть неотрицательным.`, `D = 4 − 3(y − 1)<sup>2</sup> ≥ 0 оставляет y = 0, 1, 2.`],
        sol: `Относительно x: x<sup>2</sup> − (y + 1)x + (y<sup>2</sup> − y) = 0, D = (y + 1)<sup>2</sup> − 4(y<sup>2</sup> − y) = 4 − 3(y − 1)<sup>2</sup>. Нужно D ≥ 0, поэтому y − 1 ∈ {−1, 0, 1}. При y = 0: x<sup>2</sup> − x = 0, x = 0 или 1. При y = 1: x<sup>2</sup> − 2x = 0, x = 0 или 2. При y = 2: x<sup>2</sup> − 3x + 2 = 0, x = 1 или 2. Всего 6 решений: (0, 0), (1, 0), (0, 1), (2, 1), (1, 2), (2, 2).` },
      { id: 'quad-34', lvl: 4, r: 1880, type: 'proof', q: `Числа a, b, c попарно различны. Докажите, что уравнение (x − a)(x − b) + (x − b)(x − c) + (x − c)(x − a) = 0 имеет два различных действительных корня.`,
        hints: [`Левая часть — квадратный трёхчлен со старшим коэффициентом 3.`, `Пусть a < b < c. Подставь x = b.`, `Трёхчлен с положительным старшим коэффициентом, который принимает отрицательное значение, имеет два корня.`],
        sol: `Левая часть f(x) — трёхчлен со старшим коэффициентом 3 > 0. Выражение симметрично, поэтому можно считать, что a < b < c. Тогда f(b) = (b − c)(b − a) < 0. Наименьшее значение трёхчлена −${fr('D', '12')} не больше f(b) < 0, значит, D > 0, и корней два.<br>Другой способ: f(x) = 3x<sup>2</sup> − 2(a + b + c)x + (ab + bc + ca), и ${fr('D', '4')} = (a + b + c)<sup>2</sup> − 3(ab + bc + ca) = ${fr('1', '2')}((a − b)<sup>2</sup> + (b − c)<sup>2</sup> + (c − a)<sup>2</sup>) > 0.`,
        rubric: [[2, `Левая часть — трёхчлен со старшим коэффициентом 3 (или раскрыты скобки)`], [3, `Показано f(b) < 0 при a < b < c (или D/4 записан как сумма квадратов)`], [2, `Обоснован вывод D > 0`]] },
      { id: 'quad-35', lvl: 4, r: 1920, type: 'proof', q: `Корни уравнения x<sup>2</sup> + ax + b + 1 = 0 — натуральные числа. Докажите, что число a<sup>2</sup> + b<sup>2</sup> составное.`,
        hints: [`Вырази a и b через корни по теореме Виета.`, `a = −(${X1} + ${X2}), b = ${X1}${X2} − 1.`, `Раскрой скобки в a<sup>2</sup> + b<sup>2</sup> — получится произведение.`],
        sol: `По теореме Виета a = −(${X1} + ${X2}), b = ${X1}${X2} − 1. Тогда a<sup>2</sup> + b<sup>2</sup> = ${X1}<sup>2</sup> + 2${X1}${X2} + ${X2}<sup>2</sup> + ${X1}<sup>2</sup>${X2}<sup>2</sup> − 2${X1}${X2} + 1 = ${X1}<sup>2</sup>${X2}<sup>2</sup> + ${X1}<sup>2</sup> + ${X2}<sup>2</sup> + 1 = (${X1}<sup>2</sup> + 1)(${X2}<sup>2</sup> + 1). Оба множителя — натуральные числа, не меньшие 2, поэтому число составное.`,
        rubric: [[2, `a и b выражены через корни`], [4, `Получено разложение a<sup>2</sup> + b<sup>2</sup> = (${X1}<sup>2</sup> + 1)(${X2}<sup>2</sup> + 1)`], [1, `Оба множителя не меньше 2, вывод`]] },
      { id: 'quad-36', lvl: 4, r: 1950, type: 'num', q: `Приведённые квадратные трёхчлены f(x) и g(x) имеют по два корня, причём f(1) = g(2) и g(1) = f(2). Найдите сумму всех четырёх корней этих трёхчленов.`, a: ['6'],
        hints: [`Запиши f(x) = x<sup>2</sup> + ax + b, g(x) = x<sup>2</sup> + cx + d. Сумма всех корней равна −(a + c).`, `Составь два равенства и сложи их.`],
        sol: `1 + a + b = 4 + 2c + d и 1 + c + d = 4 + 2a + b. Сложим: 2 + a + b + c + d = 8 + 2a + 2c + b + d, откуда a + c = −6. Сумма корней f равна −a, сумма корней g равна −c, всего −(a + c) = 6. Такие трёхчлены есть: f(x) = x<sup>2</sup> − 2x − 3, g(x) = x<sup>2</sup> − 4x.` },

      // ── Уровень 5 · Международный ──
      { id: 'quad-37', lvl: 5, r: 2060, type: 'num', q: `Квадратный трёхчлен f(x) таков, что уравнение (f(x))<sup>3</sup> − 4f(x) = 0 имеет ровно три различных корня. Сколько корней имеет уравнение (f(x))<sup>2</sup> = 1?`, a: ['2'],
        hints: [`(f(x))<sup>3</sup> − 4f(x) = f(x)(f(x) − 2)(f(x) + 2): трёхчлен должен принимать значения 0, 2 и −2 всего в трёх точках.`, `Уравнение f(x) = c имеет 2, 1 или 0 корней в зависимости от того, где c относительно вершины.`, `Пусть ветви направлены вверх и m — наименьшее значение f. Чем больше c, тем больше корней у f(x) = c.`],
        sol: `Уравнение распадается на f(x) = 0, f(x) = 2 и f(x) = −2; общих корней у них нет. Пусть ветви параболы направлены вверх, m — наименьшее значение f. Уравнение f(x) = c имеет 2 корня при c > m, 1 корень при c = m и ни одного при c < m. Если f(x) = −2 имеет корень, то m ≤ −2, и уравнения f(x) = 0 и f(x) = 2 дают ещё по два корня — всего не меньше 5. Значит, у f(x) = −2 корней нет, и 3 = 1 + 2: уравнение f(x) = 0 имеет один корень, то есть m = 0. Тогда f(x) = 1 имеет два корня, а f(x) = −1 — ни одного. Ответ: 2. Если ветви направлены вниз, рассуждение то же с наибольшим значением M = 0.` },
      { id: 'quad-38', lvl: 5, r: 2150, type: 'proof', q: `Докажите, что если a, b, c — длины сторон треугольника, то уравнение b<sup>2</sup>x<sup>2</sup> + (b<sup>2</sup> + c<sup>2</sup> − a<sup>2</sup>)x + c<sup>2</sup> = 0 не имеет действительных корней.`,
        hints: [`Найди дискриминант и разложи его как разность квадратов.`, `D = (b<sup>2</sup> + c<sup>2</sup> − a<sup>2</sup> − 2bc)(b<sup>2</sup> + c<sup>2</sup> − a<sup>2</sup> + 2bc) = ((b − c)<sup>2</sup> − a<sup>2</sup>)((b + c)<sup>2</sup> − a<sup>2</sup>).`, `Разложи каждую скобку ещё раз и примени неравенство треугольника.`],
        sol: `D = (b<sup>2</sup> + c<sup>2</sup> − a<sup>2</sup>)<sup>2</sup> − 4b<sup>2</sup>c<sup>2</sup> = (b<sup>2</sup> + c<sup>2</sup> − a<sup>2</sup> − 2bc)(b<sup>2</sup> + c<sup>2</sup> − a<sup>2</sup> + 2bc) = ((b − c)<sup>2</sup> − a<sup>2</sup>)((b + c)<sup>2</sup> − a<sup>2</sup>) = (b − c − a)(b − c + a)(b + c − a)(b + c + a). По неравенству треугольника b < a + c, поэтому b − c − a < 0. Кроме того, a + b > c, b + c > a и a + b + c > 0, так что остальные три множителя положительны. Значит, D < 0, и корней нет.`,
        rubric: [[2, `Дискриминант записан как разность квадратов`], [2, `Получено разложение на четыре множителя`], [2, `Знаки множителей определены по неравенству треугольника`], [1, `Вывод D < 0`]] },
      { id: 'quad-39', lvl: 5, r: 2240, type: 'proof', q: `${X1} и ${X2} — корни уравнения x<sup>2</sup> − 6x + 1 = 0. Докажите, что при любом натуральном n число ${X1}<sup>n</sup> + ${X2}<sup>n</sup> — целое и не делится на 5.`,
        hints: [`Обозначь s<sub>n</sub> = ${X1}<sup>n</sup> + ${X2}<sup>n</sup>. Из x<sup>2</sup> = 6x − 1 следует x<sup>n</sup> = 6x<sup>n−1</sup> − x<sup>n−2</sup>.`, `s<sub>n</sub> = 6s<sub>n−1</sub> − s<sub>n−2</sub>, причём s<sub>0</sub> = 2, s<sub>1</sub> = 6.`, `Посмотри на остатки от деления на 5: так как 6 даёт остаток 1, s<sub>n</sub> ≡ s<sub>n−1</sub> − s<sub>n−2</sub>.`],
        sol: `Каждый корень удовлетворяет равенству x<sup>2</sup> = 6x − 1. Умножив его на x<sup>n−2</sup>, получаем x<sup>n</sup> = 6x<sup>n−1</sup> − x<sup>n−2</sup>. Сложив такие равенства для ${X1} и ${X2}, получаем s<sub>n</sub> = 6s<sub>n−1</sub> − s<sub>n−2</sub>, где s<sub>n</sub> = ${X1}<sup>n</sup> + ${X2}<sup>n</sup>. Так как s<sub>0</sub> = 2 и s<sub>1</sub> = ${X1} + ${X2} = 6, по индукции все s<sub>n</sub> целые.<br>Теперь остатки от деления на 5. Так как 6 даёт остаток 1, остаток s<sub>n</sub> равен остатку s<sub>n−1</sub> − s<sub>n−2</sub>. Остатки идут так: 2, 1, 4, 3, 4, 1, 2, 1, … Каждый остаток определяется двумя предыдущими, а пара (2, 1) повторилась, поэтому дальше последовательность 2, 1, 4, 3, 4, 1 повторяется. Нуля в ней нет, значит, s<sub>n</sub> не делится на 5.`,
        rubric: [[2, `Выведена формула s<sub>n</sub> = 6s<sub>n−1</sub> − s<sub>n−2</sub>`], [1, `Целость s<sub>n</sub> по индукции из s<sub>0</sub> = 2, s<sub>1</sub> = 6`], [3, `Найдены остатки по модулю 5 и обоснована их периодичность`], [1, `Вывод: нулевого остатка нет`]] },
      { id: 'quad-40', lvl: 5, r: 2350, type: 'proof', q: `Докажите, что для любого трёхчлена f(x) = x<sup>2</sup> + px + q хотя бы одно из чисел |f(1)|, |f(2)|, |f(3)| не меньше ${fr('1', '2')}.`,
        hints: [`Вычисли f(1) − 2f(2) + f(3).`, `Это число равно 2 при любых p и q.`, `Предположи противное и оцени |f(1) − 2f(2) + f(3)| через сумму модулей.`],
        sol: `f(1) − 2f(2) + f(3) = (1 + p + q) − 2(4 + 2p + q) + (9 + 3p + q) = 2 при любых p и q. Если бы все три модуля были меньше ${fr('1', '2')}, то 2 = |f(1) − 2f(2) + f(3)| ≤ |f(1)| + 2|f(2)| + |f(3)| < ${fr('1', '2')} + 1 + ${fr('1', '2')} = 2 — противоречие. Оценка точная: для f(x) = (x − 2)<sup>2</sup> − ${fr('1', '2')} получаем f(1) = ${fr('1', '2')}, f(2) = −${fr('1', '2')}, f(3) = ${fr('1', '2')}.`,
        rubric: [[3, `Найдено тождество f(1) − 2f(2) + f(3) = 2`], [3, `Оценка от противного через модули`], [1, `Вывод`]] }
    ]
  });

<script>
// ---- content/alg-quad-deep.js ----
// Глубокий уровень темы «Квадратные уравнения и теорема Виета».
// Расположение корней относительно точки, дискриминант как инструмент доказательства, задачи с параметром.
(function () {
  function fr(a, b) { return '<span class="fr"><span>' + a + '</span><span>' + b + '</span></span>'; }
  function sq(x) { return '<span class="sq">√<span>' + x + '</span></span>'; }
  var X1 = 'x<sub>1</sub>', X2 = 'x<sub>2</sub>', X0 = 'x<sub>0</sub>';
  function graph(fn, a, b, n, k) { var p = []; for (var i = 0; i <= n; i++) { var x = a + (b - a) * i / n; p.push([x, fn(x) * k]); } return p; }

  // f(x) = 0,4(x − 1)(x − 5): точка t между корнями, f(t) < 0
  var ft = 0.4 * (2.2 - 1) * (2.2 - 5);
  var figRoot = MM.fig({
    pts: { x1: [1, 0], x2: [5, 0], t: [2.2, 0], 'f(t)': [2.2, ft] },
    curve: [graph(function (x) { return 0.4 * (x - 1) * (x - 5); }, -0.1, 6.1, 48, 1)],
    axes: { x: [-0.7, 6.9], y: [-2.1, 2.7] },
    gold: [['x1', 'x2']],
    dash: [['t', 'f(t)']],
    lab: { x1: 'sw', x2: 'se', t: 'n', 'f(t)': 's' },
    w: 300, alt: 'Парабола с ветвями вверх и корнями x₁, x₂. Точка t между корнями, значение f(t) под осью, то есть отрицательно'
  });

  // y = x² − 4|x| + 3 и прямая y = a (по вертикали масштаб вдвое меньше)
  var g = function (x) { return x * x - 4 * Math.abs(x) + 3; }, lev = 1.5, k = 0.5, s1 = 2 - Math.sqrt(1 + lev), s2 = 2 + Math.sqrt(1 + lev);
  var figGraph = MM.fig({
    pts: { L1: [-4.7, lev * k], L2: [4.7, lev * k], P1: [-s2, lev * k], P2: [-s1, lev * k], P3: [s1, lev * k], P4: [s2, lev * k] },
    curve: [graph(g, -4.4, 4.4, 88, k)],
    axes: { x: [-5, 5.4], y: [-1, 2.9] },
    gold: [['L1', 'L2']],
    hide: ['L1', 'L2'],
    nolab: ['P1', 'P2', 'P3', 'P4'],
    text: [[-2.35, 1.7, 'y = a']],
    w: 340, alt: 'График y = x² − 4|x| + 3 в форме буквы W и горизонтальная прямая y = a, пересекающая его в четырёх точках'
  });

  MM.addDeep('alg-quad', {
    lessons: [
      { id: 'quad-l7', title: 'Расположение корней относительно точки', mins: 16, html: `
<p>В задачах с параметром часто спрашивают не сами корни, а <b>где они лежат</b>: оба больше 1, по разные стороны от нуля, оба на отрезке. Формула корней с радикалами здесь неудобна. Работает другой язык — значения трёхчлена в нужных точках.</p>
<p>Пусть <span class="m">f(x) = ax<sup>2</sup> + bx + c</span>, <span class="m">a ≠ 0</span>, и <span class="m">${X0} = −${fr('b', '2a')}</span> — абсцисса вершины.</p>
<div class="box"><div class="box-h">Главная лемма</div>
<p>Число <span class="m">t</span> лежит строго между корнями трёхчлена тогда и только тогда, когда <span class="m">a · f(t) < 0</span>. Корни при этом существуют автоматически.</p></div>
<p><b>Доказательство.</b> Из записи <span class="m">f(t) = a(t − ${X0})<sup>2</sup> − ${fr('D', '4a')}</span> получаем <span class="m">a · f(t) = a<sup>2</sup>(t − ${X0})<sup>2</sup> − ${fr('D', '4')}</span>. Если <span class="m">D < 0</span>, это число положительно при всех <span class="m">t</span>. Если корни есть, то <span class="m">a · f(t) = a<sup>2</sup>(t − ${X1})(t − ${X2})</span>, и это число отрицательно ровно тогда, когда <span class="m">t</span> между корнями.</p>
${figRoot}
<div class="box"><div class="box-h">Таблица условий</div><ul>
<li>Один корень меньше <span class="m">t</span>, другой больше: <span class="m">a · f(t) < 0</span>.</li>
<li>Оба корня больше <span class="m">t</span>: <span class="m">D ≥ 0</span>, <span class="m">a · f(t) > 0</span>, <span class="m">${X0} > t</span>.</li>
<li>Оба корня меньше <span class="m">t</span>: <span class="m">D ≥ 0</span>, <span class="m">a · f(t) > 0</span>, <span class="m">${X0} < t</span>.</li>
<li>Оба корня на интервале <span class="m">(p; q)</span>: <span class="m">D ≥ 0</span>, <span class="m">a · f(p) > 0</span>, <span class="m">a · f(q) > 0</span>, <span class="m">p < ${X0} < q</span>.</li>
<li>Ровно один корень на интервале <span class="m">(p; q)</span>: достаточно <span class="m">f(p) · f(q) < 0</span>.</li>
</ul></div>
<p>Почему во втором пункте нужны все три условия. Из <span class="m">a · f(t) > 0</span> следует лишь, что <span class="m">t</span> не между корнями: корни оба справа, оба слева или их нет. Вершина лежит посередине между корнями, поэтому <span class="m">${X0} > t</span> выбирает «справа», а <span class="m">D ≥ 0</span> гарантирует, что корни вообще есть.</p>
<p>Последний пункт: если <span class="m">f(p)</span> и <span class="m">f(q)</span> разных знаков, ровно одна из точек <span class="m">p</span>, <span class="m">q</span> лежит между корнями, а другая — снаружи. Значит, между <span class="m">p</span> и <span class="m">q</span> ровно один корень.</p>
<div class="ex"><div class="ex-h">Пример 1</div>
<p>Числа <span class="m">a</span>, <span class="m">b</span>, <span class="m">c</span> таковы, что <span class="m">a > 0</span> и <span class="m">a + b + c < 0</span>. Докажите, что уравнение <span class="m">ax<sup>2</sup> + bx + c = 0</span> имеет два корня, один из которых больше 1, а другой меньше 1.</p>
<p><b>Решение.</b> <span class="m">a · f(1) = a(a + b + c) < 0</span>, значит, число 1 лежит строго между корнями. Ни дискриминант, ни формула корней не понадобились.</p></div>
<div class="ex"><div class="ex-h">Пример 2</div>
<p>При каких <span class="m">a</span> уравнение <span class="m">x<sup>2</sup> − 2ax + a + 2 = 0</span> имеет корни, и все они больше 1?</p>
<p><b>Решение.</b> Старший коэффициент равен 1. Условия: <span class="m">${fr('D', '4')} = a<sup>2</sup> − a − 2 = (a − 2)(a + 1) ≥ 0</span>; <span class="m">f(1) = 3 − a > 0</span>; <span class="m">${X0} = a > 1</span>. Первое даёт <span class="m">a ≤ −1</span> или <span class="m">a ≥ 2</span>, второе — <span class="m">a < 3</span>, третье — <span class="m">a > 1</span>. Ответ: <span class="m">2 ≤ a < 3</span>. При <span class="m">a = 2</span> корень один: <span class="m">x = 2</span>.</p></div>
<div class="trick"><div class="trick-h">Олимпиадный приём</div>
<p>Не решай уравнение с параметром через формулу корней с радикалами. Переведи условие на язык трёх величин: знак <span class="m">a · f(t)</span>, дискриминант и положение вершины. Получится система неравенств без корней. А в доказательствах часто хватает одной точки: если <span class="m">a · f(t) < 0</span>, то корни есть и <span class="m">t</span> лежит между ними.</p></div>` },

      { id: 'quad-l8', title: 'Дискриминант как инструмент доказательства', mins: 16, html: `
<p>До сих пор дискриминант помогал решать уравнения. На олимпиаде его используют наоборот: <b>знак трёхчлена известен, и из этого получается неравенство</b> между его коэффициентами.</p>
<div class="box"><div class="box-h">Принцип</div>
<p>Пусть <span class="m">a > 0</span>. Трёхчлен <span class="m">at<sup>2</sup> + bt + c</span> неотрицателен при всех <span class="m">t</span> тогда и только тогда, когда <span class="m">b<sup>2</sup> ≤ 4ac</span>.</p>
<p>И обратно: если <span class="m">a > 0</span> и трёхчлен хотя бы в одной точке неположителен, то <span class="m">D ≥ 0</span>; если отрицателен, то <span class="m">D > 0</span>.</p></div>
<p>Оба утверждения видны из записи <span class="m">a(t − t<sub>0</sub>)<sup>2</sup> − ${fr('D', '4a')}</span>: наименьшее значение трёхчлена равно <span class="m">−${fr('D', '4a')}</span>.</p>
<h3>Неравенство Коши — Буняковского</h3>
<p>Для любых чисел <span class="m">a<sub>1</sub>, …, a<sub>n</sub></span> и <span class="m">b<sub>1</sub>, …, b<sub>n</sub></span>:</p>
<p class="calc"><span class="m">(a<sub>1</sub>b<sub>1</sub> + … + a<sub>n</sub>b<sub>n</sub>)<sup>2</sup> ≤ (a<sub>1</sub><sup>2</sup> + … + a<sub>n</sub><sup>2</sup>)(b<sub>1</sub><sup>2</sup> + … + b<sub>n</sub><sup>2</sup>)</span>.</p>
<p><b>Доказательство.</b> Если все <span class="m">a<sub>i</sub></span> равны нулю, неравенство очевидно. Иначе рассмотрим</p>
<p class="calc"><span class="m">f(t) = (a<sub>1</sub>t − b<sub>1</sub>)<sup>2</sup> + … + (a<sub>n</sub>t − b<sub>n</sub>)<sup>2</sup> = At<sup>2</sup> − 2Ct + B</span>,</p>
<p>где <span class="m">A = a<sub>1</sub><sup>2</sup> + … + a<sub>n</sub><sup>2</sup> > 0</span>, <span class="m">B = b<sub>1</sub><sup>2</sup> + … + b<sub>n</sub><sup>2</sup></span>, <span class="m">C = a<sub>1</sub>b<sub>1</sub> + … + a<sub>n</sub>b<sub>n</sub></span>. Сумма квадратов неотрицательна при всех <span class="m">t</span>, поэтому <span class="m">${fr('D', '4')} = C<sup>2</sup> − AB ≤ 0</span>. Равенство бывает, когда у <span class="m">f</span> есть корень, то есть когда <span class="m">b<sub>i</sub> = ta<sub>i</sub></span> при всех <span class="m">i</span>: наборы пропорциональны.</p>
<h3>Все значения дроби</h3>
<div class="ex"><div class="ex-h">Пример</div>
<p>Найдите все значения выражения <span class="m">${fr('x<sup>2</sup> + x + 1', 'x<sup>2</sup> + 1')}</span>.</p>
<p><b>Решение.</b> Число <span class="m">y</span> — значение выражения, если уравнение <span class="m">y(x<sup>2</sup> + 1) = x<sup>2</sup> + x + 1</span> имеет корень, то есть <span class="m">(y − 1)x<sup>2</sup> − x + (y − 1) = 0</span>. При <span class="m">y = 1</span> корень <span class="m">x = 0</span> есть. При <span class="m">y ≠ 1</span> нужно <span class="m">D = 1 − 4(y − 1)<sup>2</sup> ≥ 0</span>, то есть <span class="m">|y − 1| ≤ ${fr('1', '2')}</span>. Ответ: все числа от <span class="m">${fr('1', '2')}</span> до <span class="m">${fr('3', '2')}</span> включительно. Например, <span class="m">${fr('3', '2')}</span> получается при <span class="m">x = 1</span>, а <span class="m">${fr('1', '2')}</span> — при <span class="m">x = −1</span>.</p></div>
<h3>Трёхчлен относительно одной переменной</h3>
<div class="ex"><div class="ex-h">Пример</div>
<p>Докажите, что <span class="m">x<sup>2</sup> + 5y<sup>2</sup> − 4xy + 2x − 6y + 3 > 0</span> при любых <span class="m">x</span> и <span class="m">y</span>.</p>
<p><b>Решение.</b> Это трёхчлен относительно <span class="m">x</span>: <span class="m">x<sup>2</sup> + (2 − 4y)x + (5y<sup>2</sup> − 6y + 3)</span>. Его <span class="m">${fr('D', '4')} = (1 − 2y)<sup>2</sup> − (5y<sup>2</sup> − 6y + 3) = −y<sup>2</sup> + 2y − 2 = −(y − 1)<sup>2</sup> − 1 < 0</span>. Старший коэффициент положителен, поэтому при любом <span class="m">y</span> трёхчлен положителен при всех <span class="m">x</span>.</p></div>
<div class="trick"><div class="trick-h">Олимпиадный приём</div>
<p>Видишь неравенство вида <span class="m">B<sup>2</sup> ≤ AC</span> — ищи трёхчлен <span class="m">At<sup>2</sup> − 2Bt + C</span>, неотрицательный при всех <span class="m">t</span>, например сумму квадратов. Видишь «найди все значения выражения» — приравняй его к <span class="m">y</span> и потребуй, чтобы у уравнения был корень. Видишь многочлен второй степени от двух переменных — считай его трёхчленом относительно одной из них.</p></div>` },

      { id: 'quad-l9', title: 'Задачи с параметром', mins: 16, html: `
<p>Задача с параметром — это целое семейство уравнений сразу, и ответить нужно для каждого значения параметра. Вот главные приёмы.</p>
<h3>1. Старший коэффициент может обратиться в ноль</h3>
<p>Если перед <span class="m">x<sup>2</sup></span> стоит выражение с параметром, при некоторых его значениях уравнение становится линейным. Этот случай всегда разбирают отдельно. Часто он даёт в ответе значение, которое теряют невнимательные.</p>
<h3>2. Смена ролей</h3>
<p>Уравнение высокой степени относительно <span class="m">x</span> иногда оказывается квадратным относительно параметра или даже относительно числа.</p>
<div class="ex"><div class="ex-h">Пример</div>
<p>Решите уравнение <span class="m">x<sup>3</sup> − (${sq('3')} + 1)x<sup>2</sup> + 3 = 0</span>.</p>
<p><b>Решение.</b> Обозначим <span class="m">s = ${sq('3')}</span> и запишем <span class="m">3 = s<sup>2</sup></span>. Получаем <span class="m">s<sup>2</sup> − x<sup>2</sup> · s + (x<sup>3</sup> − x<sup>2</sup>) = 0</span> — квадратное уравнение относительно <span class="m">s</span>. Его дискриминант <span class="m">x<sup>4</sup> − 4x<sup>3</sup> + 4x<sup>2</sup> = (x<sup>2</sup> − 2x)<sup>2</sup></span>, поэтому <span class="m">s = x</span> или <span class="m">s = x<sup>2</sup> − x</span>. Значит, <span class="m">x = ${sq('3')}</span> или <span class="m">x<sup>2</sup> − x − ${sq('3')} = 0</span>, откуда <span class="m">x = ${fr('1 ± ' + sq('1 + 4' + sq('3')), '2')}</span>. Всего три корня.</p></div>
<h3>3. Графический метод</h3>
<p>Если параметр выражается через <span class="m">x</span>, то есть <span class="m">a = g(x)</span>, то число корней равно числу точек пересечения графика <span class="m">y = g(x)</span> с горизонтальной прямой <span class="m">y = a</span>. Двигая прямую вверх и вниз, видим ответ сразу для всех <span class="m">a</span>.</p>
${figGraph}
<p>Для уравнения <span class="m">x<sup>2</sup> − 4|x| + 3 = a</span>: при <span class="m">a < −1</span> корней нет, при <span class="m">a = −1</span> их два, при <span class="m">−1 < a < 3</span> — четыре (как на чертеже), при <span class="m">a = 3</span> — три, при <span class="m">a > 3</span> — два.</p>
<h3>4. Симметрия</h3>
<p>Если уравнение не меняется при замене <span class="m">x</span> на <span class="m">−x</span>, его корни идут парами <span class="m">x</span> и <span class="m">−x</span>. Поэтому единственным корнем может быть только <span class="m">x = 0</span>. Это необходимое условие, и после него обязательна проверка.</p>
<div class="ex"><div class="ex-h">Пример</div>
<p>При каких <span class="m">a</span> уравнение <span class="m">x<sup>2</sup> + a|x| + a<sup>2</sup> − 4 = 0</span> имеет единственный корень?</p>
<p><b>Решение.</b> Корень должен быть <span class="m">x = 0</span>, откуда <span class="m">a<sup>2</sup> = 4</span>, <span class="m">a = ±2</span>. При <span class="m">a = 2</span> уравнение <span class="m">x<sup>2</sup> + 2|x| = 0</span> имеет только корень 0 — подходит. При <span class="m">a = −2</span> уравнение <span class="m">x<sup>2</sup> − 2|x| = 0</span> имеет корни 0 и ±2 — не подходит. Ответ: <span class="m">a = 2</span>.</p></div>
<div class="trick"><div class="trick-h">Олимпиадный приём</div>
<p>Порядок действий с параметром. 1) Может ли обнулиться старший коэффициент? 2) Выражается ли параметр через <span class="m">x</span> — тогда графический метод. 3) Не квадратное ли уравнение относительно параметра — тогда смена ролей. 4) Есть ли симметрия? 5) Условия на корни — через знак <span class="m">a · f(t)</span>, дискриминант и вершину.</p></div>` }
    ],

    problems: [
      // ── Уровень 4 · Финал ──
      { id: 'quad-41', lvl: 4, r: 1960, type: 'num', q: `Найдите наибольшее значение выражения <span class="nw">${fr('x + 1', 'x<sup>2</sup> + 3')}</span>.`, a: ['0.5', '1/2'],
        hints: [`Число y — значение выражения, если уравнение y(x<sup>2</sup> + 3) = x + 1 имеет корень.`, `yx<sup>2</sup> − x + 3y − 1 = 0. При y ≠ 0 нужно D ≥ 0.`],
        sol: `Число y — значение выражения, если уравнение yx<sup>2</sup> − x + (3y − 1) = 0 имеет корень. При y = 0 корень x = −1 есть. При y ≠ 0 нужно D = 1 − 4y(3y − 1) ≥ 0, то есть 12y<sup>2</sup> − 4y − 1 ≤ 0, (2y − 1)(6y + 1) ≤ 0, −${fr('1', '6')} ≤ y ≤ ${fr('1', '2')}. Наибольшее значение ${fr('1', '2')} достигается при x = 1: ${fr('2', '4')} = ${fr('1', '2')}.` },
      { id: 'quad-42', lvl: 4, r: 1970, type: 'num', q: `Сколько существует целых a, при которых уравнение (a − 2)x<sup>2</sup> − 2ax + 2a − 3 = 0 имеет корни и все его корни положительны?`, a: ['5'],
        hints: [`Не забудь случай a = 2: уравнение становится линейным.`, `При a ≠ 2: ${fr('D', '4')} = a<sup>2</sup> − (a − 2)(2a − 3) = −(a − 1)(a − 6).`, `Оба корня положительны, когда их произведение и сумма положительны.`],
        sol: `При a = 2 уравнение −4x + 1 = 0 имеет корень ${fr('1', '4')} > 0 — подходит. При a ≠ 2: ${fr('D', '4')} = a<sup>2</sup> − (a − 2)(2a − 3) = −(a − 1)(a − 6) ≥ 0, то есть 1 ≤ a ≤ 6. Корни (в том числе совпадающие) положительны, когда ${X1}${X2} = ${fr('2a − 3', 'a − 2')} > 0 и ${X1} + ${X2} = ${fr('2a', 'a − 2')} > 0. Первое верно при a < ${fr('3', '2')} или a > 2, второе — при a < 0 или a > 2. Вместе с 1 ≤ a ≤ 6 получаем 2 < a ≤ 6. Добавив a = 2, получаем 2 ≤ a ≤ 6: пять целых значений — 2, 3, 4, 5, 6.` },
      { id: 'quad-43', lvl: 4, r: 1980, type: 'proof', q: `Числа a, b, c таковы, что a ≠ 0 и 2a + 3b + 6c = 0. Докажите, что уравнение ax<sup>2</sup> + bx + c = 0 имеет корень на интервале (0; 1).`,
        hints: [`Посмотри на значения f(0), f(½) и f(1), где f(x) = ax<sup>2</sup> + bx + c.`, `f(0) + 4f(½) + f(1) = 2a + 3b + 6c = 0.`, `Если сумма трёх чисел с положительными коэффициентами равна нулю, среди них есть числа разных знаков или нули. Отдельно разбери случаи f(0) = 0 и f(1) = 0.`],
        sol: `Пусть f(x) = ax<sup>2</sup> + bx + c. Тогда f(0) + 4f(${fr('1', '2')}) + f(1) = c + (a + 2b + 4c) + (a + b + c) = 2a + 3b + 6c = 0.<br>Если f(${fr('1', '2')}) = 0, корень ${fr('1', '2')} найден. Если f(0) = 0, то c = 0 и 2a + 3b = 0, корни уравнения 0 и −${fr('b', 'a')} = ${fr('2', '3')} — подходит ${fr('2', '3')}. Если f(1) = 0, то b = −a − c, и из условия −a + 3c = 0, c = ${fr('a', '3')}; корни 1 и ${fr('c', 'a')} = ${fr('1', '3')} — подходит ${fr('1', '3')}.<br>Остался случай, когда все три значения ненулевые. Так как 4f(${fr('1', '2')}) = −(f(0) + f(1)), хотя бы одно из чисел f(0), f(1) имеет знак, противоположный f(${fr('1', '2')}). Тогда по таблице из урока на интервале (0; ${fr('1', '2')}) или (${fr('1', '2')}; 1) есть корень.`,
        rubric: [[2, `Тождество f(0) + 4f(½) + f(1) = 2a + 3b + 6c`], [3, `Значения разных знаков, отсюда корень на (0; ½) или (½; 1)`], [2, `Разобраны случаи f(0) = 0 и f(1) = 0: корни ⅔ и ⅓`]] },
      { id: 'quad-44', lvl: 4, r: 1990, type: 'num', q: `Действительные числа a, b, c, d, e таковы, что a + b + c + d + e = 8 и a<sup>2</sup> + b<sup>2</sup> + c<sup>2</sup> + d<sup>2</sup> + e<sup>2</sup> = 16. Найдите наибольшее возможное значение e. (Олимпиада США, 1978)`, a: ['3.2', '16/5'],
        hints: [`Рассмотри f(t) = (t − a)<sup>2</sup> + (t − b)<sup>2</sup> + (t − c)<sup>2</sup> + (t − d)<sup>2</sup>. Он неотрицателен при всех t.`, `f(t) = 4t<sup>2</sup> − 2(8 − e)t + (16 − e<sup>2</sup>). Его дискриминант не больше нуля.`],
        sol: `f(t) = (t − a)<sup>2</sup> + (t − b)<sup>2</sup> + (t − c)<sup>2</sup> + (t − d)<sup>2</sup> = 4t<sup>2</sup> − 2(8 − e)t + (16 − e<sup>2</sup>) ≥ 0 при всех t, поэтому ${fr('D', '4')} = (8 − e)<sup>2</sup> − 4(16 − e<sup>2</sup>) ≤ 0, то есть 5e<sup>2</sup> − 16e ≤ 0, 0 ≤ e ≤ ${fr('16', '5')}. Значение ${fr('16', '5')} достигается при a = b = c = d = ${fr('6', '5')}: сумма ${fr('24', '5')} + ${fr('16', '5')} = 8, сумма квадратов ${fr('144', '25')} + ${fr('256', '25')} = 16. Ответ: 3,2.` },
      { id: 'quad-45', lvl: 4, r: 2000, type: 'proof', q: `Дан трёхчлен f(x) = x<sup>2</sup> + px + q. Уравнение f(x) = x не имеет действительных корней. Докажите, что уравнение f(f(x)) = x тоже не имеет действительных корней.`,
        hints: [`Трёхчлен f(x) − x не имеет корней. Какой у него знак?`, `f(y) > y при любом y. Подставь y = f(x).`],
        sol: `Трёхчлен f(x) − x = x<sup>2</sup> + (p − 1)x + q не имеет корней, а его старший коэффициент положителен, поэтому f(y) − y > 0, то есть f(y) > y при любом y. Подставив y = f(x), получаем f(f(x)) > f(x), а f(x) > x. Значит, f(f(x)) > x при всех x, и равенство f(f(x)) = x невозможно. Для трёхчлена с отрицательным старшим коэффициентом рассуждение то же с обратными знаками.`,
        rubric: [[2, `f(x) − x сохраняет знак, и этот знак положителен`], [2, `Неравенство f(y) > y применено к y = f(x)`], [2, `Цепочка f(f(x)) > f(x) > x`], [1, `Вывод`]] },
      { id: 'quad-46', lvl: 4, r: 2010, type: 'num', q: `При каком a уравнение |x<sup>2</sup> − 2|x| − 3| = a имеет ровно пять корней?`, a: ['3'],
        hints: [`Левая часть не меняется при замене x на −x. Как тогда устроены корни?`, `Корни идут парами ±x, поэтому нечётное число корней бывает, только если x = 0 — корень.`, `Найди a из условия x = 0 и проверь, что корней действительно пять.`],
        sol: `Левая часть не меняется при замене x на −x, поэтому ненулевые корни идут парами ±x. Нечётное число корней бывает, только если x = 0 — корень, то есть a = |−3| = 3. Проверка при x ≥ 0: |x<sup>2</sup> − 2x − 3| = 3 даёт x<sup>2</sup> − 2x − 3 = 3, откуда x = 1 + ${sq('7')}, или x<sup>2</sup> − 2x − 3 = −3, откуда x = 0 или x = 2. Положительных корней два (2 и 1 + ${sq('7')}), с отрицательными парами и нулём — пять. Ответ: a = 3.` },
      { id: 'quad-47', lvl: 4, r: 2030, type: 'num', q: `При каком a уравнение x<sup>2</sup> − 2x + a|x − 1| + a<sup>2</sup> − 8 = 0 имеет единственный корень?`, a: ['3'],
        hints: [`Сделай замену t = x − 1.`, `t<sup>2</sup> + a|t| + a<sup>2</sup> − 9 = 0 не меняется при замене t на −t.`, `Единственный корень может быть только t = 0. Не забудь проверку.`],
        sol: `При t = x − 1 уравнение принимает вид t<sup>2</sup> + a|t| + a<sup>2</sup> − 9 = 0. Оно не меняется при замене t на −t, поэтому корни идут парами, и единственный корень — это t = 0. Отсюда a<sup>2</sup> = 9, a = ±3. При a = 3: t<sup>2</sup> + 3|t| = 0, только t = 0 — подходит. При a = −3: t<sup>2</sup> − 3|t| = 0, корни t = 0 и t = ±3 — не подходит. Ответ: a = 3.` },
      { id: 'quad-48', lvl: 4, r: 2050, type: 'proof', q: `Числа a, b, c таковы, что (a + c)(a + b + c) < 0. Докажите, что (b − c)<sup>2</sup> > 4a(a + b + c).`,
        hints: [`Подбери трёхчлен, дискриминант которого равен (b − c)<sup>2</sup> − 4a(a + b + c).`, `g(x) = ax<sup>2</sup> + (b − c)x + (a + b + c). Вычисли g(0) и g(−1).`, `g(0) · g(−1) = 2(a + c)(a + b + c) < 0. Не забудь случай a = 0.`],
        sol: `Рассмотрим g(x) = ax<sup>2</sup> + (b − c)x + (a + b + c); его дискриминант D = (b − c)<sup>2</sup> − 4a(a + b + c). Имеем g(0) = a + b + c и g(−1) = a − (b − c) + a + b + c = 2(a + c), поэтому g(0) · g(−1) = 2(a + c)(a + b + c) < 0.<br>Если a ≠ 0, одно из чисел g(0), g(−1) имеет знак, противоположный a. По главной лемме у g два корня, то есть D > 0 — это и требовалось.<br>Если a = 0, нужно доказать (b − c)<sup>2</sup> > 0, то есть b ≠ c. Условие принимает вид c(b + c) < 0, а при b = c было бы 2c<sup>2</sup> < 0 — невозможно.`,
        rubric: [[2, `Найден трёхчлен g(x) = ax<sup>2</sup> + (b − c)x + (a + b + c) с нужным дискриминантом`], [2, `Вычислено g(0) · g(−1) = 2(a + c)(a + b + c) < 0`], [2, `Отсюда D > 0`], [1, `Разобран случай a = 0`]] },

      // ── Уровень 5 · Международный ──
      { id: 'quad-49', lvl: 5, r: 2100, type: 'num', q: `Найдите все a, при которых все решения неравенства x<sup>2</sup> − 2ax + 2a + 3 ≤ 0 (если они есть) лежат на отрезке [0; 4]. Множество таких a — промежуток. Найдите его длину и запишите ответ несократимой дробью.`, a: ['25/6'],
        hints: [`Если у неравенства нет решений, условие выполнено автоматически. Когда так бывает?`, `${fr('D', '4')} = (a − 3)(a + 1). При −1 < a < 3 решений нет.`, `Иначе решения — отрезок между корнями. Он лежит в [0; 4], если f(0) ≥ 0, f(4) ≥ 0 и вершина a лежит на [0; 4].`],
        sol: `Пусть f(x) = x<sup>2</sup> − 2ax + 2a + 3, ${fr('D', '4')} = a<sup>2</sup> − 2a − 3 = (a − 3)(a + 1). При −1 < a < 3 решений нет, и условие выполнено. При a = −1 единственное решение x = −1 не лежит на отрезке, а при a = 3 единственное решение x = 3 лежит. При a < −1 или a > 3 решения — отрезок между корнями. Он лежит на [0; 4], когда f(0) = 2a + 3 ≥ 0, f(4) = 19 − 6a ≥ 0 и вершина a лежит на [0; 4]. На луче a < −1 вершина отрицательна, а на луче a > 3 условия дают 3 < a ≤ ${fr('19', '6')}. Итог: −1 < a ≤ ${fr('19', '6')}, длина промежутка ${fr('19', '6')} + 1 = ${fr('25', '6')}.` },
      { id: 'quad-50', lvl: 5, r: 2180, type: 'num', q: `Приведённые квадратные трёхчлены P(x) и Q(x) таковы, что уравнение P(Q(x)) = 0 имеет корни −9, −7, −5, −3, а уравнение Q(P(x)) = 0 — корни −35, −33, −29, −27. Найдите сумму наименьших значений трёхчленов P(x) и Q(x).`, a: ['-52'],
        hints: [`Корни уравнения Q(x) = c симметричны относительно вершины Q.`, `P(Q(x)) = 0 ⇔ Q(x) = p<sub>1</sub> или Q(x) = p<sub>2</sub>, где p<sub>1</sub>, p<sub>2</sub> — корни P. Разбей четыре корня на две пары с общей серединой.`, `Вершина Q — в точке −6, вершина P — в точке −31. Запиши Q(x) = (x + 6)<sup>2</sup> + k, P(x) = (x + 31)<sup>2</sup> + m.`],
        sol: `P(Q(x)) = 0 ⇔ Q(x) = p<sub>1</sub> или Q(x) = p<sub>2</sub>, где p<sub>1</sub>, p<sub>2</sub> — корни P. Корни каждого уравнения Q(x) = p<sub>i</sub> симметричны относительно вершины Q, поэтому четыре корня разбиваются на две пары с общей серединой: {−9, −3} и {−7, −5}, середина −6. Значит, Q(x) = (x + 6)<sup>2</sup> + k. Так же из корней Q(P(x)) = 0 получаем P(x) = (x + 31)<sup>2</sup> + m.<br>Корни P — это Q(−9) = 9 + k и Q(−7) = 1 + k. Их середина 5 + k — вершина P, поэтому 5 + k = −31, k = −36. Корни Q — это P(−35) = 16 + m и P(−33) = 4 + m; их середина 10 + m = −6, m = −16. Наименьшие значения трёхчленов — m = −16 и k = −36, сумма −52. Проверка: Q(x) = x(x + 12), P(x) = (x + 27)(x + 35).` },
      { id: 'quad-51', lvl: 5, r: 2260, type: 'proof', q: `Найдите все пары натуральных чисел p и q, при которых оба уравнения x<sup>2</sup> + px + q = 0 и x<sup>2</sup> + qx + p = 0 имеют целые корни.`,
        hints: [`Корни обоих уравнений отрицательны. Обозначь корни первого −a и −b, второго −c и −d, где a, b, c, d — натуральные.`, `a + b = p, ab = q, c + d = q, cd = p.`, `Сложи (a − 1)(b − 1) и (c − 1)(d − 1).`],
        sol: `Сумма корней первого уравнения −p < 0, произведение q > 0, поэтому оба корня отрицательны: −a и −b, где a, b — натуральные, a + b = p, ab = q. Так же корни второго: −c и −d, c + d = q, cd = p. Тогда (a − 1)(b − 1) + (c − 1)(d − 1) = (ab − a − b + 1) + (cd − c − d + 1) = (q − p + 1) + (p − q + 1) = 2. Оба слагаемых — целые неотрицательные числа.<br>Если оба равны 1, то a = b = 2 и c = d = 2, то есть p = q = 4. Если (a − 1)(b − 1) = 0 и (c − 1)(d − 1) = 2, то {c, d} = {2, 3}, q = 5, p = 6; тогда a = 1, b = 5, и ab = 5 = q — подходит. Симметрично p = 5, q = 6. Ответ: (4, 4), (5, 6), (6, 5).`,
        rubric: [[1, `Корни отрицательны, введены натуральные a, b, c, d`], [3, `Получено (a − 1)(b − 1) + (c − 1)(d − 1) = 2`], [2, `Разобраны случаи 1 + 1, 0 + 2, 2 + 0`], [1, `Ответ с проверкой`]] },
      { id: 'quad-52', lvl: 5, r: 2320, type: 'num', q: `При каком наибольшем a уравнение x<sup>4</sup> − 2ax<sup>2</sup> − x + a<sup>2</sup> − a = 0 имеет ровно два различных действительных корня? Ответ запишите десятичной дробью.`, a: ['0.75', '3/4'],
        hints: [`Посмотри на уравнение как на квадратное относительно a.`, `a<sup>2</sup> − (2x<sup>2</sup> + 1)a + (x<sup>4</sup> − x) = 0, его дискриминант равен (2x + 1)<sup>2</sup>.`, `Уравнение распадается: (x<sup>2</sup> + x + 1 − a)(x<sup>2</sup> − x − a) = 0. Следи за общим корнем двух множителей.`],
        sol: `Относительно a: a<sup>2</sup> − (2x<sup>2</sup> + 1)a + x<sup>4</sup> − x = 0, D = (2x<sup>2</sup> + 1)<sup>2</sup> − 4(x<sup>4</sup> − x) = (2x + 1)<sup>2</sup>. Отсюда a = x<sup>2</sup> + x + 1 или a = x<sup>2</sup> − x, то есть уравнение равносильно (x<sup>2</sup> + x + 1 − a)(x<sup>2</sup> − x − a) = 0. Дискриминанты множителей: D<sub>1</sub> = 4a − 3 и D<sub>2</sub> = 4a + 1. Общий корень: вычитая, получаем 2x + 1 = 0, x = −${fr('1', '2')}, что бывает только при a = ${fr('3', '4')}.<br>При a > ${fr('3', '4')} оба множителя дают по два корня, общих нет — четыре корня. При a = ${fr('3', '4')} первый даёт единственный корень −${fr('1', '2')}, а второй, x<sup>2</sup> − x − ${fr('3', '4')} = 0, — корни ${fr('3', '2')} и −${fr('1', '2')}: всего два различных корня. Ответ: 0,75.` },
      { id: 'quad-53', lvl: 5, r: 2380, type: 'proof', q: `Числа a, b, c, x, y, z таковы, что a<sup>2</sup> > b<sup>2</sup> + c<sup>2</sup>. Докажите неравенство Ацеля: (ax − by − cz)<sup>2</sup> ≥ (a<sup>2</sup> − b<sup>2</sup> − c<sup>2</sup>)(x<sup>2</sup> − y<sup>2</sup> − z<sup>2</sup>).`,
        hints: [`Рассмотри f(t) = (at − x)<sup>2</sup> − (bt − y)<sup>2</sup> − (ct − z)<sup>2</sup>.`, `Старший коэффициент f равен a<sup>2</sup> − b<sup>2</sup> − c<sup>2</sup> > 0. Найди точку, где f(t) ≤ 0.`, `f(x/a) = −(bx/a − y)<sup>2</sup> − (cx/a − z)<sup>2</sup> ≤ 0.`],
        sol: `Рассмотрим f(t) = (at − x)<sup>2</sup> − (bt − y)<sup>2</sup> − (ct − z)<sup>2</sup> = (a<sup>2</sup> − b<sup>2</sup> − c<sup>2</sup>)t<sup>2</sup> − 2(ax − by − cz)t + (x<sup>2</sup> − y<sup>2</sup> − z<sup>2</sup>). Старший коэффициент положителен по условию; в частности, a ≠ 0. При t = ${fr('x', 'a')} первое слагаемое равно нулю: f(${fr('x', 'a')}) = −(${fr('bx', 'a')} − y)<sup>2</sup> − (${fr('cx', 'a')} − z)<sup>2</sup> ≤ 0. Если бы дискриминант был отрицателен, трёхчлен с положительным старшим коэффициентом был бы положителен везде. Значит, ${fr('D', '4')} = (ax − by − cz)<sup>2</sup> − (a<sup>2</sup> − b<sup>2</sup> − c<sup>2</sup>)(x<sup>2</sup> − y<sup>2</sup> − z<sup>2</sup>) ≥ 0, что и требовалось.`,
        rubric: [[2, `Выбран трёхчлен f(t), раскрыты скобки`], [2, `Найдена точка t = x/a, где f(t) ≤ 0`], [2, `Обосновано, что D ≥ 0`], [1, `Вывод неравенства`]] },
      { id: 'quad-54', lvl: 5, r: 2440, type: 'proof', q: `Натуральное число a и целые числа b, c таковы, что уравнение ax<sup>2</sup> + bx + c = 0 имеет два различных корня на интервале (0; 1). Докажите, что a ≥ 5, и приведите пример с a = 5.`,
        hints: [`Числа f(0) = c и f(1) = a + b + c — целые. Какого они знака?`, `f(0) · f(1) = a<sup>2</sup> · ${X1}(1 − ${X1}) · ${X2}(1 − ${X2}).`, `x(1 − x) ≤ ¼, причём равенство только при x = ½.`],
        sol: `Пусть f(x) = ax<sup>2</sup> + bx + c = a(x − ${X1})(x − ${X2}). Числа 0 и 1 не лежат между корнями, поэтому a · f(0) > 0 и a · f(1) > 0. Значит, f(0) = c и f(1) = a + b + c — целые положительные числа, и f(0) · f(1) ≥ 1. С другой стороны, f(0) · f(1) = a<sup>2</sup> · ${X1}${X2} · (1 − ${X1})(1 − ${X2}) = a<sup>2</sup> · ${X1}(1 − ${X1}) · ${X2}(1 − ${X2}). Так как x(1 − x) = ${fr('1', '4')} − (x − ${fr('1', '2')})<sup>2</sup> ≤ ${fr('1', '4')}, а различные корни не могут оба равняться ${fr('1', '2')}, произведение ${X1}(1 − ${X1}) · ${X2}(1 − ${X2}) < ${fr('1', '16')}. Поэтому 1 ≤ f(0)f(1) < ${fr('a<sup>2</sup>', '16')}, a<sup>2</sup> > 16, a ≥ 5. Пример: 5x<sup>2</sup> − 5x + 1 = 0, корни ${fr('5 ± ' + sq('5'), '10')} лежат на (0; 1).`,
        rubric: [[2, `f(0) и f(1) — целые положительные числа`], [2, `f(0) · f(1) = a<sup>2</sup> · ${X1}(1 − ${X1}) · ${X2}(1 − ${X2})`], [2, `Оценка x(1 − x) ≤ ¼, строгая для различных корней, отсюда a<sup>2</sup> > 16`], [1, `Пример с a = 5`]] },
      { id: 'quad-55', lvl: 5, r: 2490, type: 'proof', q: `Приведённый квадратный трёхчлен f(x) = x<sup>2</sup> + ax + b таков, что уравнение f(f(x)) = 0 имеет четыре различных действительных корня, и сумма каких-то двух из них равна −1. Докажите, что b ≤ −${fr('1', '4')}.`,
        hints: [`Пусть r<sub>1</sub>, r<sub>2</sub> — корни f. Тогда f(f(x)) = 0 ⇔ f(x) = r<sub>1</sub> или f(x) = r<sub>2</sub>, и каждое уравнение даёт два корня.`, `Если два корня с суммой −1 — корни одного уравнения f(x) = r<sub>i</sub>, то по теореме Виета −a = −1.`, `Если они из разных уравнений: сложи равенства f(u) = r<sub>1</sub> и f(v) = r<sub>2</sub> и вспомни, что r<sub>1</sub> + r<sub>2</sub> = −a.`],
        sol: `Пусть r<sub>1</sub>, r<sub>2</sub> — корни f; они различны, иначе у f(f(x)) = 0 не больше двух корней. f(f(x)) = 0 ⇔ f(x) = r<sub>1</sub> или f(x) = r<sub>2</sub>, и четыре различных корня означают, что у каждого из этих уравнений два корня. Пусть u + v = −1 для двух корней u, v.<br><b>Случай 1:</b> u и v — корни одного уравнения x<sup>2</sup> + ax + b − r<sub>i</sub> = 0. По теореме Виета u + v = −a, значит, a = 1. Наименьшее значение f равно b − ${fr('1', '4')}, и уравнения f(x) = r<sub>1</sub>, f(x) = r<sub>2</sub> имеют по два корня, поэтому r<sub>1</sub>, r<sub>2</sub> > b − ${fr('1', '4')}. Но r<sub>1</sub> + r<sub>2</sub> = −1, так что меньшее из них не больше −${fr('1', '2')}. Значит, b − ${fr('1', '4')} < −${fr('1', '2')}, и b < −${fr('1', '4')}.<br><b>Случай 2:</b> f(u) = r<sub>1</sub>, f(v) = r<sub>2</sub>. Сложим: u<sup>2</sup> + v<sup>2</sup> + a(u + v) + 2b = r<sub>1</sub> + r<sub>2</sub> = −a. Так как u + v = −1, получаем u<sup>2</sup> + v<sup>2</sup> = −2b. Но u<sup>2</sup> + v<sup>2</sup> ≥ ${fr('(u + v)<sup>2</sup>', '2')} = ${fr('1', '2')}, поэтому −2b ≥ ${fr('1', '2')} и b ≤ −${fr('1', '4')}.`,
        rubric: [[1, `Сведение к уравнениям f(x) = r<sub>1</sub>, f(x) = r<sub>2</sub>, у каждого по два корня`], [3, `Случай корней одного уравнения: a = 1 и оценка через вершину`], [3, `Случай корней разных уравнений: u<sup>2</sup> + v<sup>2</sup> = −2b и оценка u<sup>2</sup> + v<sup>2</sup> ≥ ½`]] }
    ]
  });
})();

<script>
(function () {
  'use strict';

  var EVENTS = [
    { d: new Date(2027, 10, 1), name: 'Регистрация на RFO', note: 'ноябрь 2027, на portal.edu.az' },
    { d: new Date(2027, 11, 1), name: 'Районный этап', note: 'декабрь 2027 — январь 2028' },
    { d: new Date(2028, 3, 9), name: 'Финал RFO', note: 'ориентир: второе воскресенье апреля 2028' }
  ];
  var WEEK_OPTS = [5, 7, 10, 12, 15]; // часов в неделю
  function weekGoalMin() { return (WEEK_OPTS.indexOf(S.weekGoal) >= 0 ? S.weekGoal : 10) * 60; }
  // секунды за 7 дней, заканчивающихся днём end
  function weekSecAt(end) { var s = 0, d = end; for (var i = 0; i < 7; i++) { s += S.time[d] || 0; d = addDays(d, -1); } return s; }
  var HINT_COST = 0.2;
  var MONTHS = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
  var KEYS = ['√', '²', '³', 'ⁿ', '·', '±', '≤', '≥', '≠', '≡', '∣', '∤', '⇒', '⇔', '∈', 'ℕ', 'ℤ', '∀', '∃', '∠', '△', '°', 'π', '∞', '⌊', '⌋', '₁', '₂', 'ₖ', 'ₙ'];
  var REPL = [['<=', '≤'], ['>=', '≥'], ['!=', '≠'], ['=>', '⇒'], ['sqrt', '√'], ['^2', '²'], ['^3', '³'], ['^n', 'ⁿ']];

  // ---------- index ----------
  var P = {}, T = {}, ALL = [];
  MM.topics.forEach(function (t) {
    T[t.id] = t;
    t.problems.forEach(function (p, i) { p.topic = t.id; p.idx = i; P[p.id] = p; ALL.push(p); });
  });
  var DIAG = MM.diag ? MM.diag.problems : [];

  // ---------- storage ----------
  var storageOK = true;
  function fresh() {
    return { v: 1, rating: null, peak: null, n: 0, hist: [], att: {}, rev: {}, time: {}, days: {}, daily: {}, weekly: {}, diag: null, diagRun: null, teacher: {}, drafts: {}, read: {}, goals: { from: {}, done: {} }, flash: null, notice: null, lastTopic: null, lastExport: null, weekGoal: 10 };
  }
  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (!raw) return fresh();
      return Object.assign(fresh(), JSON.parse(raw));
    } catch (e) { storageOK = false; return fresh(); }
  }
  var S = load();
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(S)); storageOK = true; } catch (e) { storageOK = false; }
  }

  // ---------- helpers ----------
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function pad(n) { return String(n).padStart(2, '0'); }
  function ymd(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function today() { return ymd(new Date()); }
  function addDays(s, k) { var p = s.split('-').map(Number); return ymd(new Date(p[0], p[1] - 1, p[2] + k)); }
  function weekKey() { var x = new Date(); x = new Date(x.getFullYear(), x.getMonth(), x.getDate()); x.setDate(x.getDate() - (x.getDay() + 6) % 7); return ymd(x); }
  function daysTo(date) { var t = new Date(); var a = new Date(t.getFullYear(), t.getMonth(), t.getDate()); return Math.round((date - a) / 86400000); }
  function fmtDate(d) { return d.getDate() + ' ' + MONTHS[d.getMonth()] + ' ' + d.getFullYear(); }
  function fmtShort(ts) { var d = new Date(ts); return d.getDate() + ' ' + MONTHS[d.getMonth()]; }
  function plural(n, a, b, c) { var m10 = n % 10, m100 = n % 100; if (m10 === 1 && m100 !== 11) return a; if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return b; return c; }
  function sign(d) { return d > 0 ? '+' + d : d < 0 ? '−' + Math.abs(d) : '±0'; }
  function deltaCls(d) { return d > 0 ? 'up' : d < 0 ? 'down' : 'zero'; }
  function hash32(s) { var h = 2166136261; for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
  function mins(sec) { var m = Math.round(sec / 60); return m < 60 ? m + ' мин' : Math.floor(m / 60) + ' ч ' + (m % 60) + ' мин'; }
  function pct(r) { return Math.max(0, Math.min(100, (r - SCALE[0]) / (SCALE[1] - SCALE[0]) * 100)); }

  // ---------- rating ----------
  function expected(R, Pr) { return 1 / (1 + Math.pow(10, (Pr - R) / 400)); }
  function applyRating(p, s, w) {
    var R = S.rating == null ? 1000 : S.rating;
    var k = (S.n < 20 ? 48 : S.n < 60 ? 32 : 24) * w;
    var d = Math.round(k * (s - expected(R, p.r)));
    if (d === 0 && s >= 0.5) d = 1;
    S.rating = Math.max(100, R + d);
    S.n++;
    S.peak = Math.max(S.peak || 0, S.rating);
    S.hist.push([Date.now(), S.rating]);
    if (S.hist.length > 500) S.hist.splice(0, S.hist.length - 500);
    checkGoals();
    return d;
  }
  // Goals: the next stage above the rating is the current goal; reaching it is celebrated once.
  function checkGoals() {
    if (S.rating == null) return;
    STAGES.forEach(function (s) {
      if (S.rating >= s.r && !S.goals.done[s.r] && S.goals.from[s.r] != null) { S.goals.done[s.r] = Date.now(); S.flash = s.r; }
    });
  }
  function currentGoal() {
    if (S.rating == null) return null;
    var g = stageNext(S.rating); if (!g) return null;
    if (S.goals.from[g.r] == null) { S.goals.from[g.r] = S.rating; save(); }
    return { s: g, from: Math.min(S.goals.from[g.r], S.rating) };
  }
  function stageBy(r) { for (var i = 0; i < STAGES.length; i++) if (STAGES[i].r === Number(r)) return STAGES[i]; return null; }
  function stageNext(r) { for (var i = 0; i < STAGES.length; i++) if (STAGES[i].r > r) return STAGES[i]; return null; }
  function delta7() {
    if (!S.hist.length) return 0;
    var cut = Date.now() - 7 * 86400000, base = S.hist[0][1];
    for (var i = 0; i < S.hist.length; i++) { if (S.hist[i][0] <= cut) base = S.hist[i][1]; else break; }
    return S.rating - base;
  }

  // ---------- progress ----------
  var RANK = { bad: 0, ok: 1, clean: 2 };
  function status(id) { var a = S.att[id]; return a ? a.st : 'new'; }
  function isDue(id) { var r = S.rev[id]; return !!(r && r.due <= today() && S.att[id]); }
  function dueList() { return Object.keys(S.rev).filter(isDue).filter(function (id) { return P[id]; }); }
  function mastery(ps) {
    if (!ps.length) return 0;
    var v = 0; ps.forEach(function (p) { var s = status(p.id); v += s === 'clean' ? 1 : s === 'ok' ? 0.6 : 0; });
    return v / ps.length;
  }
  function solvedIn(ps) { return ps.filter(function (p) { var s = status(p.id); return s === 'clean' || s === 'ok'; }).length; }
  function recommend(t) {
    for (var L = 1; L <= 5; L++) {
      var ps = t.problems.filter(function (p) { return p.lvl === L; });
      if (mastery(ps) < 0.7) {
        var c = ps.filter(function (p) { return status(p.id) === 'new'; })[0] || ps.filter(function (p) { return status(p.id) === 'bad' && !S.rev[p.id]; })[0];
        if (c) return c;
      }
    }
    return t.problems.filter(function (p) { return status(p.id) === 'new'; })[0] || null;
  }
  function nextStep(t) {
    var base = t.lessons.filter(function (l) { return !l.deep; });
    var unread = base.filter(function (l) { return !S.read[l.id]; });
    var read = base.length - unread.length;
    var unreadDeep = t.lessons.filter(function (l) { return l.deep && !S.read[l.id]; });
    var p = recommend(t);
    if (unread.length && (read < 2 || !p || (p.lvl >= 3 && read < base.length))) {
      return { href: '#l-' + unread[0].id, label: 'Читать: ' + unread[0].title, kind: 'lesson', lesson: unread[0] };
    }
    // глубокие уроки — когда дошёл до глубоких задач или до международного уровня
    if (unreadDeep.length && (!p || p.deep || p.lvl >= 5)) {
      return { href: '#l-' + unreadDeep[0].id, label: 'Читать: ' + unreadDeep[0].title, kind: 'lesson', lesson: unreadDeep[0] };
    }
    if (p) return { href: '#p-' + p.id, label: 'Задача ' + (p.idx + 1) + ' · ' + LV[p.lvl][0], kind: 'problem', p: p };
    return { href: '#t-' + t.id, label: 'Тема пройдена — повтори трудные задачи', kind: 'done' };
  }
  function markDay() { var k = today(); S.days[k] = (S.days[k] || 0) + 1; }
  function streak() { var d = today(); if (!S.days[d]) d = addDays(d, -1); var n = 0; while (S.days[d]) { n++; d = addDays(d, -1); } return n; }
  function weekSec() { return weekSecAt(today()); }
  function reviewStep(id, good) {
    var r = S.rev[id]; if (!r) return;
    if (!good) { r.step = 0; r.due = addDays(today(), 1); return; }
    r.step++;
    if (r.step >= 3) delete S.rev[id]; else r.due = addDays(today(), [1, 3, 7][r.step]);
  }

  // ---------- daily / weekly ----------
  function dailyId() {
    var k = today();
    if (S.daily[k] && P[S.daily[k].id]) return S.daily[k].id;
    var R = S.rating == null ? 1000 : S.rating;
    var tests = ALL.filter(function (p) { return p.type !== 'proof'; });
    var pool = tests.filter(function (p) { return !S.att[p.id]; });
    if (!pool.length) pool = tests.filter(function (p) { return status(p.id) !== 'clean'; });
    if (!pool.length) pool = tests;
    pool = pool.slice().sort(function (a, b) { return Math.abs(a.r - R - 60) - Math.abs(b.r - R - 60); }).slice(0, 3);
    var id = pool[hash32(k) % pool.length].id;
    S.daily[k] = { id: id, done: false };
    save();
    return id;
  }
  function weeklyId() {
    var k = weekKey();
    if (S.weekly[k] && P[S.weekly[k].id]) return S.weekly[k].id;
    var R = S.rating == null ? 1000 : S.rating;
    var proofs = ALL.filter(function (p) { return p.type === 'proof'; });
    var pool = proofs.filter(function (p) { return status(p.id) !== 'clean'; });
    if (!pool.length) pool = proofs;
    pool = pool.slice().sort(function (a, b) { return Math.abs(a.r - R - 250) - Math.abs(b.r - R - 250); });
    var id = pool[0].id;
    S.weekly[k] = { id: id, done: false };
    save();
    return id;
  }
  function noteSolved(id, good) {
    var dk = today(), wk = weekKey();
    if (good && S.daily[dk] && S.daily[dk].id === id) S.daily[dk].done = true;
    if (good && S.weekly[wk] && S.weekly[wk].id === id) S.weekly[wk].done = true;
  }

  // ---------- answering ----------
  var cur = null;
  function newCur(id) { return { id: id, hints: 0, t0: Date.now(), phase: 'solve', result: null, picked: null, showSol: false, reviewDone: false, rub: {}, other: false, none: false }; }
  function norm(v) { return String(v).trim().replace(/\s+/g, '').replace(',', '.').replace(/−/g, '-').replace(/^\+/, ''); }
  function checkNum(p, v) {
    var x = norm(v); if (!x) return null;
    return p.a.some(function (a) { var y = norm(a); return x === y || (!isNaN(Number(x)) && !isNaN(Number(y)) && Number(x) === Number(y)); });
  }
  function hintFactor() { return Math.max(0.2, 1 - HINT_COST * cur.hints); }
  function answerTest(id, ok, picked) {
    var p = P[id], a = S.att[id], d = null;
    if (!a) {
      var s = ok ? hintFactor() : 0;
      d = applyRating(p, s, 1);
      S.att[id] = { st: ok ? (cur.hints ? 'ok' : 'clean') : 'bad', s: s, d: d, h: cur.hints, at: Date.now(), tries: 1, sec: Math.round((Date.now() - cur.t0) / 1000) };
      if (!ok || cur.hints >= 2) S.rev[id] = { due: addDays(today(), 1), step: 0 };
    } else if (isDue(id) && !cur.reviewDone) {
      d = applyRating(p, ok ? hintFactor() : 0, 0.5);
      reviewStep(id, ok && !cur.hints);
      cur.reviewDone = true;
      a.tries++; if (ok && a.st === 'bad') a.st = 'ok';
    } else {
      a.tries++; if (ok && a.st === 'bad') a.st = 'ok';
    }
    markDay(); noteSolved(id, ok);
    cur.result = { ok: ok, d: d, sec: Math.round((Date.now() - cur.t0) / 1000) };
    cur.picked = picked;
    cur.phase = ok ? 'done' : 'wrong';
    if (ok) cur.showSol = true;
    save(); render();
    var f = document.getElementById('after'); if (f) f.focus();
  }
  function giveUp(id) {
    var p = P[id];
    if (!S.att[id]) {
      var d = applyRating(p, 0, 0.5);
      S.att[id] = { st: 'bad', s: 0, d: d, h: cur.hints, at: Date.now(), tries: 0, seen: true };
      S.rev[id] = { due: addDays(today(), 1), step: 0 };
      cur.result = { ok: false, d: d, gaveUp: true };
      markDay();
    }
    cur.showSol = true; cur.phase = cur.phase === 'solve' ? 'seen' : cur.phase;
    save(); render();
  }
  function gradeProof(id, pts) {
    var p = P[id], a = S.att[id], d = null;
    var s = pts / 7 * hintFactor();
    var st = pts === 7 && !cur.hints ? 'clean' : pts >= 4 ? 'ok' : 'bad';
    if (!a) {
      d = applyRating(p, s, 1);
      S.att[id] = { st: st, s: s, d: d, h: cur.hints, at: Date.now(), tries: 1, pts: pts };
      if (st !== 'clean') S.rev[id] = { due: addDays(today(), 3), step: 0 };
    } else if (isDue(id) && !cur.reviewDone) {
      d = applyRating(p, s, 0.5);
      reviewStep(id, pts >= 6 && !cur.hints);
      cur.reviewDone = true;
      a.tries++; if (RANK[st] > RANK[a.st]) a.st = st; a.pts = Math.max(a.pts || 0, pts);
    } else {
      a.tries++; if (RANK[st] > RANK[a.st]) a.st = st; a.pts = Math.max(a.pts || 0, pts);
    }
    markDay(); noteSolved(id, pts >= 4);
    cur.result = { pts: pts, d: d };
    cur.phase = 'graded';
    save(); render();
    var f = document.getElementById('after'); if (f) f.focus();
  }

  // ---------- diagnostic ----------
  function perfRating(items) {
    var score = items.reduce(function (s, x) { return s + (x.ok ? 1 : 0); }, 0);
    var rs = items.map(function (x) { return x.r; });
    if (score === 0) return Math.max(600, Math.min.apply(null, rs) - 150);
    if (score === items.length) return Math.min(1700, Math.max.apply(null, rs) + 150);
    var lo = 300, hi = 2700;
    for (var it = 0; it < 50; it++) {
      var mid = (lo + hi) / 2, e = 0;
      items.forEach(function (x) { e += expected(mid, x.r); });
      if (e < score) lo = mid; else hi = mid;
    }
    return Math.round(Math.max(600, Math.min(1700, (lo + hi) / 2)) / 5) * 5;
  }
  function diagFinish() {
    var run = S.diagRun, items = [], bySec = {};
    DIAG.forEach(function (p) {
      var v = run.ans[p.id], ok = false;
      if (v != null) ok = p.type === 'choice' ? v === p.a : !!checkNum(p, v);
      items.push({ id: p.id, ok: ok, r: p.r });
      bySec[p.sec] = bySec[p.sec] || [0, 0];
      bySec[p.sec][1]++; if (ok) bySec[p.sec][0]++;
    });
    var perf = perfRating(items);
    var res = { ts: Date.now(), perf: perf, bySec: bySec, ok: {}, ans: run.ans, applied: false };
    items.forEach(function (x) { res.ok[x.id] = x.ok; });
    if (S.n === 0) {
      S.rating = perf; S.peak = Math.max(S.peak || 0, perf); S.hist = [[Date.now(), perf]]; res.applied = true;
    }
    S.diag = res; S.diagRun = null; markDay();
    save();
  }

  // ---------- routing ----------
  var route = { view: 'today' };
  function parseRoute() {
    var h = (location.hash || '').replace('#', '');
    if (h.indexOf('p-') === 0) return { view: 'problem', id: h.slice(2) };
    if (h.indexOf('t-') === 0) return { view: 'topic', id: h.slice(2) };

    return { view: 'today' };
  }

      '<p>MIT mission — личный неофициальный проект подготовки к олимпиаде. Не связан с Массачусетским технологическим институтом. Задачи и уроки составлены по официальной программе Республиканской олимпиады по математике. Прогресс хранится только в этом браузере — перенести его на другое устройство можно в профиле.</p></footer>';
  }
  function ladder(r) {

    }).join('');

    var label = r == null ? 'Шкала этапов: от школьной базы до международного уровня' : 'Рейтинг ' + r + '. Цель — золото RFO, ' + STAGES[4].r;

  }

      '<div class="card-title">' + probLabel(p) + '</div><div class="card-q">' + p.q + '</div>' +
      '<div class="card-meta"><span class="pill num">' + p.r + '</span><span>' + (p.type === 'proof' ? 'доказательство' : 'тест') + '</span>' + (extra || '') + '</div></a>';

  // ---------- views ----------
